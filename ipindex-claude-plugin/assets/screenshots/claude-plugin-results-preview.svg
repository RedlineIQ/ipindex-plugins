  <rect x="920" y="132" width="42" height="42" fill="none" stroke="#2563EB" stroke-width="4"/>
  <path d="M932 144L950 162M932 162L950 144" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <text x="210" y="216" fill="#2563EB" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="17">PATENTS - TRADEMARKS - COPYRIGHTS</text>
  <line x1="210" y1="252" x2="990" y2="252" stroke="#DBD7CF" stroke-width="2"/>
  <text x="210" y="308" fill="#15120D" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif" font-size="26">Patents and applications</text>
