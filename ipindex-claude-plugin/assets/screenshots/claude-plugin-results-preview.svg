  <text x="905" y="309" text-anchor="middle" fill="#15120D" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18">12 records</text>
  <text x="210" y="372" fill="#15120D" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif" font-size="26">Trademark registrations</text>
  <rect x="820" y="348" width="170" height="36" fill="#F3F0E9"/>
