  <text x="210" y="436" fill="#15120D" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif" font-size="26">Copyright registrations</text>
  <rect x="820" y="412" width="170" height="36" fill="#F3F0E9"/>
  <text x="905" y="437" text-anchor="middle" fill="#15120D" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18">3 records</text>
  <line x1="210" y1="482" x2="990" y2="482" stroke="#DBD7CF" stroke-width="2"/>
